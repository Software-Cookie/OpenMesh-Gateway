apiVersion: v1
kind: Service
metadata:
  name: openmesh-gateway
  labels: { app.kubernetes.io/name: openmesh-gateway }
spec:
  selector: { app.kubernetes.io/name: openmesh-gateway }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openmesh-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.example.com]
      secretName: openmesh-gateway-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: openmesh-gateway, port: { name: http } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openmesh-gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: openmesh-gateway }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openmesh-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: openmesh-gateway }
---
# Only the ingress controller and Prometheus may reach the pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmesh-gateway
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: openmesh-gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8080, protocol: TCP }
