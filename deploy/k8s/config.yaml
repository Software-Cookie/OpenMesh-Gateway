apiVersion: v1
kind: ConfigMap
metadata:
  name: openmesh-gateway-config
data:
  SPRING_PROFILES_ACTIVE: prod
  OPENMESH_ENVIRONMENT: production
  # Identity provider (Keycloak / Auth0 / Okta / Entra ID)
  OPENMESH_JWT_ISSUER: https://auth.example.com/realms/openmesh
  OPENMESH_JWT_JWK_SET_URI: https://auth.example.com/realms/openmesh/protocol/openid-connect/certs
  OPENMESH_JWT_AUDIENCE: openmesh-gateway
  OPENMESH_JWT_ROLES_CLAIM: realm_access.roles
  OPENMESH_JWT_TENANT_CLAIM: tenant_id
  # Managed Redis (ElastiCache / Memorystore / Azure Cache) with TLS
  REDIS_HOST: redis.example.internal
  REDIS_PORT: "6379"
  REDIS_SSL: "true"
  # One ingress / load balancer in front of the pods
  OPENMESH_TRUSTED_PROXY_HOPS: "1"
  # Dynamic routes may only target in-cluster services
  OPENMESH_ROUTE_ALLOWED_HOSTS: "*.svc.cluster.local"
  # Static route targets
  DOWNSTREAM_ALPHA_URL: http://orders.shop.svc.cluster.local:8080
  DOWNSTREAM_BETA_URL: http://inventory.shop.svc.cluster.local:8080
---
# Example only. Create the real Secret with your secret manager (External Secrets, Sealed Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: openmesh-gateway-secrets
type: Opaque
stringData:
  REDIS_PASSWORD: replace-me
  OPENMESH_IDENTITY_SIGNING_SECRET: replace-with-at-least-32-random-characters
