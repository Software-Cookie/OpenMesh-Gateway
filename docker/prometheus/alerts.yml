groups:
  - name: openmesh-gateway
    rules:
      - alert: GatewayDown
        expr: up{job="openmesh-gateway"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "OpenMesh gateway instance {{ $labels.instance }} is down"

      - alert: GatewayHigh5xxRate
        expr: |
          sum(rate(openmesh_gateway_requests_total{status_category="5xx"}[5m]))
            / clamp_min(sum(rate(openmesh_gateway_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of gateway requests are failing with 5xx"

      - alert: GatewayHighLatencyP99
        expr: |
          histogram_quantile(0.99, sum(rate(openmesh_gateway_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Gateway p99 latency above 1s"

      - alert: TenantHeavilyRateLimited
        expr: sum(rate(openmesh_gateway_ratelimit_rejected_total[5m])) by (tenant) > 5
        for: 10m
        labels: { severity: info }
        annotations:
          summary: "Tenant {{ $labels.tenant }} is being rate limited (upsell or abuse?)"

      - alert: CircuitBreakerOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is open: a downstream service is failing"
