# Local demo stack: gateway + Redis + two mock services + Prometheus + Grafana.
#   docker compose -f docker/docker-compose.yml up --build
# Override ports or secrets with a .env file next to this file (see .env.example).
# The gateway runs with the "dev" profile here so the console can mint test tokens.

name: openmesh

services:
  openmesh-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: openmesh-gateway:local
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-openmesh-dev-redis}
      DOWNSTREAM_ALPHA_URL: http://downstream-service-alpha:8081
      DOWNSTREAM_BETA_URL: http://downstream-service-beta:8082
      OPENMESH_IDENTITY_SIGNING_SECRET: ${IDENTITY_SIGNING_SECRET:-dev-only-identity-signing-secret-change-me}
      OPENMESH_ENVIRONMENT: docker-demo
      # Set to 1 when a reverse proxy (Caddy, nginx) sits in front, so rate limits use the real client IP
      OPENMESH_TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    depends_on:
      redis:
        condition: service_healthy
      downstream-service-alpha:
        condition: service_started
      downstream-service-beta:
        condition: service_started
    networks: [openmesh-net]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-openmesh-dev-redis}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-openmesh-dev-redis}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-openmesh-dev-redis}
    volumes:
      - redis-data:/data
    networks: [openmesh-net]

  downstream-service-alpha:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      IDENTITY_SIGNING_SECRET: ${IDENTITY_SIGNING_SECRET:-dev-only-identity-signing-secret-change-me}
    volumes:
      - ./mock-downstream/alpha:/app:ro
    networks: [openmesh-net]

  downstream-service-beta:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ./mock-downstream/beta:/app:ro
    networks: [openmesh-net]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks: [openmesh-net]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [openmesh-net]

volumes:
  redis-data:

networks:
  openmesh-net:
